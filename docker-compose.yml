services:
  ticket-master:
    build:
      context: .
      dockerfile: master.Dockerfile
    container_name: ticket-master-service
    restart: unless-stopped
    networks:
      - app-network
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      CONFIG_PATH: /app/data
      WEB_ADDR: ":8080"
      WEB_TOKEN: ${WEB_TOKEN:-}
    volumes:
      - ./data:/app/data

  ticket-worker:
    build:
      context: .
      dockerfile: worker.Dockerfile
    restart: unless-stopped
    networks:
      - app-network
    env_file:
      - path: .env
        required: false
    environment:
      MASTER_SERVER_ADDR: ticket-master:40052
      PUSHPLUS_TOKEN: ${PUSHPLUS_TOKEN:-}
      BARK_TOKEN: ${BARK_TOKEN:-}
      SERVERCHAN_KEY: ${SERVERCHAN_KEY:-}
      SERVERCHAN3_API_URL: ${SERVERCHAN3_API_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_HTTP_PROXY: ${TELEGRAM_HTTP_PROXY:-}
      TICKET_INTERVAL: ${TICKET_INTERVAL:-}
      RATE_LIMIT_DELAY_MS: ${RATE_LIMIT_DELAY_MS:-300}
      RISK_LOCAL_RETRIES: ${RISK_LOCAL_RETRIES:-5}
      PROXY_LIST: ${PROXY_LIST:-}
      PROXY_API_URL: ${PROXY_API_URL:-}
      CONN_PER_HOST: ${CONN_PER_HOST:-4}
      CREATE_BATCH_SIZE: ${CREATE_BATCH_SIZE:-2}
      ENABLE_WARMUP: ${ENABLE_WARMUP:-true}
      TICKET_TIME_START: ${TICKET_TIME_START:-}
    depends_on:
      - ticket-master

networks:
  app-network:
    driver: bridge
